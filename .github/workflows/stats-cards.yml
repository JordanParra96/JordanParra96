name: GitHub-Readme-Stats-Cards

on:
  schedule: # 06:23 UTC == 01:23 Bogota
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-readme-stats-cards
    steps:
      - uses: actions/checkout@v5

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&hide_border=true&bg_color=00000000&title_color=40c463&icon_color=40c463&text_color=c9d1d9&ring_color=40c463
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }} # PAT (repo, read:user) para contar repos privados

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&hide_border=true&bg_color=00000000&title_color=216e39&icon_color=216e39&text_color=24292f&ring_color=216e39
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }} # PAT (repo, read:user) para contar repos privados

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=en&hide_title=true&layout=compact&card_width=320&langs_count=6&hide_border=true&bg_color=00000000&title_color=40c463&text_color=c9d1d9
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }} # PAT (repo, read:user) para contar repos privados

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=en&hide_title=true&layout=compact&card_width=320&langs_count=6&hide_border=true&bg_color=00000000&title_color=216e39&text_color=24292f
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }} # PAT (repo, read:user) para contar repos privados

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile/*.svg
          if git commit -m "chore: update readme stats cards (light/dark)"; then
            git pull --rebase origin main
            git push
          fi
